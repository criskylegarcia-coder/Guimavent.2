name: guimavent
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  qr_flutter: ^4.1.0

  supabase_flutter: ^2.9.1

  flutter_map: ^8.2.1

  latlong2: ^0.9.1

  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  go_router: ^17.4.0
  mobile_scanner: ^7.4.0
  # Pinned (not ^) to 2.26.0: 2.27.0+ "migrated" their Android build.gradle
  # to AGP 9's built-in Kotlin, but only checks the AGP major version, not
  # this project's android.builtInKotlin=false (Flutter's own template
  # default during the migration period) — so on AGP 9 nothing applies a
  # Kotlin plugin to :mapbox_maps_flutter at all and the build fails with
  # "Could not find method kotlin()". 2.26.0 unconditionally applies
  # kotlin-android, which works correctly with builtInKotlin=false. Bump
  # once mapbox/mapbox-maps-flutter fixes the AGP-version check to also
  # respect android.builtInKotlin.
  mapbox_maps_flutter: 2.26.0
  geolocator: ^14.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.3
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/guimavent_logo_plain.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/guimavent_icon_square.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/guimavent_icon_square.png"